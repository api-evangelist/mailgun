aid: mailgun
name: Mailgun
description: Mailgun (by Sinch) is a transactional email API service for developers
  to send, receive, validate, and track emails at scale. The platform provides SMTP
  and HTTP APIs for sending email, inbound message routing, deliverability analytics,
  suppression management, and email validation with regional endpoints for US and
  EU data residency.
type: Index
